# project_id is required by the Supabase CLI once this repo is linked to a
# project (`supabase link --project-ref <ref>`). Fill it in locally — it's
# not committed with a real value to keep this config project-agnostic.
project_id = "your-project-ref"

[auth.email.template.confirmation]
subject = "Confirmez votre adresse e-mail — Mon Taxi Santé"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe — Mon Taxi Santé"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion — Mon Taxi Santé"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse e-mail — Mon Taxi Santé"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Vous êtes invité(e) sur Mon Taxi Santé"
content_path = "./supabase/templates/invite.html"
