name: Rafraîchir les données SEO (communes / hôpitaux)

on:
  schedule:
    # Le 1er de chaque mois à 5h UTC. Les référentiels open data (communes,
    # FINESS) évoluent peu et lentement — un rafraîchissement mensuel suffit.
    - cron: "0 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-seo-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Étapes séparées et non bloquantes : si la découverte du dataset FINESS
      # échoue (le dataset officiel change parfois de slug), on ne veut pas
      # perdre le rafraîchissement des communes qui, lui, a réussi.
      - name: Régénérer les communes
        id: communes
        run: pnpm run seo:communes
        continue-on-error: true

      - name: Régénérer les hôpitaux
        id: hospitals
        run: pnpm run seo:hospitals
        continue-on-error: true

      - name: Régénérer le sitemap
        run: pnpm run seo:sitemap

      - name: Ouvrir une Pull Request si les données ont changé
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(seo): rafraîchissement mensuel des données communes/hôpitaux"
          title: "chore(seo): rafraîchissement mensuel des données communes/hôpitaux"
          body: |
            Mise à jour automatique générée par le workflow `refresh-seo-data`.

            - Source communes : geo.api.gouv.fr (statut : ${{ steps.communes.outcome }})
            - Source hôpitaux : FINESS, data.gouv.fr (statut : ${{ steps.hospitals.outcome }})

            À vérifier avant merge : le diff de `src/data/seo/communes.json` et
            `src/data/seo/hospitals.json`, et que le build passe toujours. Si
            une étape a échoué, voir les logs du job pour le détail (dataset
            FINESS introuvable, colonnes CSV inattendues, etc.) — relancer
            manuellement avec les options `--list` / `--dataset=` /
            `--resource-url=` de `fetch-hospitals.mjs` si besoin.
          branch: chore/refresh-seo-data
          delete-branch: true
          add-paths: |
            src/data/seo/*.json
            public/sitemap.xml

      - name: Échouer le job si une étape de récupération a échoué
        if: steps.communes.outcome == 'failure' || steps.hospitals.outcome == 'failure'
        run: |
          echo "Au moins une source de données a échoué (voir les étapes ci-dessus)."
          exit 1
