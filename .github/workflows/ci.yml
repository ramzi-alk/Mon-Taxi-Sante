name: CI

# Filet de sécurité minimal avant merge : jusqu'ici, aucune PR n'était
# vérifiée automatiquement (ni typecheck, ni build, ni tests) — voir
# ROADMAP.md Sprint 4. Un `tsc` ou un `vite build` cassé, ou une divergence
# de la formule tarifaire CPAM (voir scripts/verify-pricing-parity.mjs),
# pouvait donc atteindre main sans qu'on s'en aperçoive avant la prod.
#
# Un job par vérification (plutôt qu'une suite de steps séquentielle dans
# un seul job) : lint/typecheck/tests unitaires/build/e2e ne dépendent pas
# les uns des autres, donc GitHub Actions les exécute tous en parallèle —
# le retour sur une PR reflète le plus lent d'entre eux (l'e2e, qui installe
# Chromium) plutôt que la somme de tous.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:vite

  pricing-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Parité tarifaire TS/SQL (pricing.ts vs compute_booking_price)
        # Nécessite un accès réseau réel + les identifiants du projet Supabase
        # (voir scripts/verify-pricing-parity.mjs) — ignoré si ces secrets ne
        # sont pas configurés sur le repo, plutôt que de faire échouer toute
        # la CI pour un contributeur externe ou un fork.
        if: ${{ env.VITE_SUPABASE_URL != '' && env.VITE_SUPABASE_ANON_KEY != '' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run verify:pricing-parity

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installer Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests e2e
        run: pnpm run test:e2e
